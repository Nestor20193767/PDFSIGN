<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Firma Digital Esteganográfica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        canvas { touch-action: none; background: #fff; cursor: crosshair; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold text-slate-800 flex items-center">
                <i class="fas fa-file-signature text-blue-600 mr-2"></i>
                SecureSign <span class="text-xs ml-2 bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full"> KIW PROTO</span>
            </h1>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto mt-8 bg-white rounded-xl shadow-xl overflow-hidden mb-10">

        <div class="flex border-b border-slate-200">
            <button onclick="switchTab('firmar')" id="tab-firmar" class="flex-1 p-4 font-semibold text-blue-600 border-b-2 border-blue-600 bg-blue-50 transition-all">
                <i class="fas fa-pen-nib mr-2"></i>Firmar Documento
            </button>
            <button onclick="switchTab('validar')" id="tab-validar" class="flex-1 p-4 font-semibold text-slate-500 hover:bg-slate-50 transition-all">
                <i class="fas fa-shield-alt mr-2"></i>Validar Integridad
            </button>
        </div>

        <div id="view-firmar" class="p-8">
            <form id="signForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Correo Institucional</label>
                    <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="usuario@entidad.gob.pe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Documento PDF</label>
                    <input type="file" id="pdfInput" accept="application/pdf" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Panel de Firma</label>
                    <div class="border-2 border-slate-300 border-dashed rounded-lg bg-slate-50 relative">
                        <canvas id="signature-pad" class="w-full h-48 rounded-lg"></canvas>
                        <button type="button" onclick="clearCanvas()" class="absolute top-2 right-2 text-xs bg-white border px-2 py-1 rounded shadow text-red-500">Borrar</button>
                    </div>
                </div>
                <button type="button" onclick="enviarFirma()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow flex justify-center items-center">
                    <span id="btnText">Firmar Documento</span>
                    <div id="loading" class="loader ml-2 hidden"></div>
                </button>
            </form>
            <div id="resultSign" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg text-center">
                <h3 class="text-green-800 font-bold">¡Firma Procesada!</h3>
                <a id="downloadLink" href="#" class="inline-block mt-2 bg-green-600 text-white px-6 py-2 rounded-full font-bold hover:bg-green-700 transition">Descargar PDF Firmado</a>
            </div>
        </div>

        <div id="view-validar" class="p-8 hidden bg-slate-50">
            <div class="text-center max-w-lg mx-auto">
                <div class="bg-white p-8 rounded-xl shadow border border-slate-200">
                    <div class="mb-4">
                        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                            <i class="fas fa-search"></i>
                        </div>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800 mb-2">Auditoría de Documentos</h2>
                    <p class="text-slate-500 text-sm mb-6">Sube un PDF para verificar si contiene metadatos esteganográficos válidos.</p>

                    <input type="file" id="pdfValidate" accept="application/pdf" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-6">

                    <button onclick="validarPDF()" class="w-full bg-slate-800 text-white py-3 rounded-lg font-bold hover:bg-slate-900 transition flex justify-center items-center">
                        <span id="btnValText">Verificar Integridad</span>
                        <div id="loadingVal" class="loader ml-2 hidden border-t-white"></div>
                    </button>
                </div>

                <div id="validationResult" class="mt-6 text-left hidden">
                    </div>
            </div>
        </div>

    </div>

    <script>
        // --- LOGICA UI TABS ---
        function switchTab(tab) {
            document.getElementById('view-firmar').classList.add('hidden');
            document.getElementById('view-validar').classList.add('hidden');

            // Reset estilos tabs
            document.getElementById('tab-firmar').className = "flex-1 p-4 font-semibold text-slate-500 hover:bg-slate-50 transition-all";
            document.getElementById('tab-validar').className = "flex-1 p-4 font-semibold text-slate-500 hover:bg-slate-50 transition-all";

            // Activar
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            const activeClass = "flex-1 p-4 font-semibold text-blue-600 border-b-2 border-blue-600 bg-blue-50 transition-all";
            document.getElementById(`tab-${tab}`).className = activeClass;
        }

        // --- VALIDAR PDF (NUEVA LÓGICA VISUAL) ---
        async function validarPDF() {
            const fileInput = document.getElementById('pdfValidate');
            const resultDiv = document.getElementById('validationResult');
            const btnText = document.getElementById('btnValText');
            const loader = document.getElementById('loadingVal');

            if (!fileInput.files[0]) return alert("Por favor selecciona un archivo PDF.");

            // UI Loading
            btnText.innerText = "Analizando...";
            loader.classList.remove('hidden');
            resultDiv.classList.add('hidden');
            resultDiv.innerHTML = ""; // Limpiar anterior

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const res = await fetch('/validar_pdf', { method: 'POST', body: formData });
                const data = await res.json();

                resultDiv.classList.remove('hidden');

                if (data.status === 'success') {
                    // Generar HTML para cada firma encontrada
                    let htmlContent = `<div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-4 rounded shadow-sm">
                        <p class="font-bold">✅ Documento Auténtico</p>
                        <p class="text-sm">Se encontraron ${data.cantidad} firma(s) válida(s).</p>
                    </div>`;

                    data.datos.forEach((firma, index) => {
                        // Formatear datos del dispositivo para mostrar
                        const device = firma.dispositivo || {};
                        const infoDispositivo = `Pantalla: ${device.screen || 'N/A'}, Cores: ${device.cores || 'N/A'}`;

                        htmlContent += `
                        <div class="bg-white border border-slate-200 rounded-lg shadow-md p-5 mb-4 relative overflow-hidden">
                            <div class="absolute top-0 right-0 bg-blue-600 text-white text-xs px-2 py-1 rounded-bl">Firma #${index + 1}</div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <p class="text-xs text-slate-400 uppercase font-bold">Firmante</p>
                                    <p class="text-slate-800 font-medium break-all"><i class="fas fa-envelope text-blue-500 mr-2"></i>${firma.email}</p>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400 uppercase font-bold">Fecha de Firma</p>
                                    <p class="text-slate-800"><i class="far fa-clock text-blue-500 mr-2"></i>${new Date(firma.fecha).toLocaleString()}</p>
                                </div>
                                <div class="col-span-1 md:col-span-2">
                                    <p class="text-xs text-slate-400 uppercase font-bold">Token Único (UUID)</p>
                                    <p class="font-mono text-xs bg-slate-100 p-2 rounded border border-slate-200 text-slate-600 select-all">${firma.token}</p>
                                </div>
                                <div class="col-span-1 md:col-span-2 mt-2 pt-2 border-t border-slate-100">
                                    <p class="text-xs text-slate-400 uppercase font-bold">Huella del Dispositivo</p>
                                    <p class="text-xs text-slate-500 mt-1">
                                        <i class="fas fa-mobile-alt mr-1"></i> ${infoDispositivo} <br>
                                        <i class="fas fa-globe mr-1"></i> ${device.ua ? device.ua.substring(0, 50) + '...' : 'N/A'}
                                    </p>
                                </div>
                            </div>
                        </div>`;
                    });

                    resultDiv.innerHTML = htmlContent;

                } else {
                    // CASO ERROR / NO FIRMADO
                    resultDiv.innerHTML = `
                    <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-6 rounded shadow-sm text-center">
                        <i class="fas fa-exclamation-triangle text-3xl mb-3 text-red-400"></i>
                        <h3 class="font-bold text-lg">Firma No Detectada</h3>
                        <p class="text-sm mt-2">No se encontraron metadatos de seguridad en este archivo.</p>
                        <p class="text-xs mt-2 text-red-500">Posibles causas: El archivo fue modificado, comprimido o no fue firmado por este sistema.</p>
                    </div>`;
                }

            } catch (err) {
                console.error(err);
                resultDiv.classList.remove('hidden');
                resultDiv.innerHTML = `<div class="bg-red-100 text-red-700 p-4 rounded">Error de conexión con el servidor.</div>`;
            } finally {
                btnText.innerText = "Verificar Integridad";
                loader.classList.add('hidden');
            }
        }

        // --- INICIALIZAR CANVAS (MISMO CÓDIGO ANTERIOR) ---
        const canvas = document.getElementById('signature-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = "#000";
        }
        window.addEventListener("resize", resizeCanvas);
        setTimeout(resizeCanvas, 500); // Delay para asegurar render

        // Eventos Canvas (Mouse y Touch)
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.touches ? e.touches[0].clientX : e.clientX) - rect.left,
                y: (e.touches ? e.touches[0].clientY : e.clientY) - rect.top
            };
        }
        ['mousedown', 'touchstart'].forEach(e => canvas.addEventListener(e, (ev) => { isDrawing=true; ctx.beginPath(); ctx.moveTo(getPos(ev).x, getPos(ev).y); ev.preventDefault(); }));
        ['mousemove', 'touchmove'].forEach(e => canvas.addEventListener(e, (ev) => { if(!isDrawing)return; ctx.lineTo(getPos(ev).x, getPos(ev).y); ctx.stroke(); ev.preventDefault(); }));
        ['mouseup', 'touchend'].forEach(e => canvas.addEventListener(e, () => isDrawing=false));
        function clearCanvas(){ ctx.clearRect(0,0,canvas.width,canvas.height); }

        // --- ENVIAR FIRMA (AJUSTADO PARA EL NUEVO HTML) ---
        async function enviarFirma() {
            const email = document.getElementById('email').value;
            const pdfFile = document.getElementById('pdfInput').files[0];
            const btn = document.getElementById('btnText');
            const load = document.getElementById('loading');

            if(!email || !pdfFile) return alert("Completa todos los campos");

            btn.innerText = "Procesando..."; load.classList.remove('hidden');

            const metadata = {
                ua: navigator.userAgent,
                screen: `${window.screen.width}x${window.screen.height}`,
                cores: navigator.hardwareConcurrency || 1
            };

            const formData = new FormData();
            formData.append('email', email);
            formData.append('pdf_file', pdfFile);
            formData.append('firma_base64', canvas.toDataURL());
            formData.append('device_data', JSON.stringify(metadata));

            try {
                const res = await fetch('/procesar_firma', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.status === 'success') {
                    document.getElementById('resultSign').classList.remove('hidden');
                    document.getElementById('downloadLink').href = data.download_url;
                } else {
                    alert("Error: " + data.msg);
                }
            } catch(e) { alert("Error de servidor"); }
            finally { btn.innerText = "Firmar Documento"; load.classList.add('hidden'); }
        }
    </script>
</body>
</html>
