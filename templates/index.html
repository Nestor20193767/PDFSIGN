<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Firma Digital Esteganográfica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        canvas { touch-action: none; background: #fff; cursor: crosshair; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold text-slate-800 flex items-center">
                <i class="fas fa-file-signature text-blue-600 mr-2"></i>
                SecureSign <span class="text-xs ml-2 bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">KIW PROTO</span>
            </h1>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto mt-8 bg-white rounded-xl shadow-xl overflow-hidden mb-10">

        <div class="flex border-b border-slate-200">
            <button onclick="switchTab('firmar')" id="tab-firmar" class="flex-1 p-4 font-semibold text-blue-600 border-b-2 border-blue-600 bg-blue-50 transition-all">
                <i class="fas fa-pen-nib mr-2"></i>Firmar Documento
            </button>
            <button onclick="switchTab('validar')" id="tab-validar" class="flex-1 p-4 font-semibold text-slate-500 hover:bg-slate-50 transition-all">
                <i class="fas fa-shield-alt mr-2"></i>Validar Integridad
            </button>
        </div>

        <div id="view-firmar" class="p-8">
            <form id="signForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Correo Institucional</label>
                    <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="usuario@entidad.gob.pe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Documento PDF</label>
                    <input type="file" id="pdfInput" accept="application/pdf" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Panel de Firma</label>
                    <div class="border-2 border-slate-300 border-dashed rounded-lg bg-slate-50 relative">
                        <canvas id="signature-pad" class="w-full h-48 rounded-lg"></canvas>
                        <button type="button" onclick="clearCanvas()" class="absolute top-2 right-2 text-xs bg-white border px-2 py-1 rounded shadow text-red-500">Borrar</button>
                    </div>
                </div>
                <button type="button" onclick="abrirEditor()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow flex justify-center items-center">
                    <span id="btnText">Continuar y Ubicar Firma</span>
                    <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </form>

            <div id="resultSign" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg text-center">
                <h3 class="text-green-800 font-bold">¡Firma Procesada!</h3>
                <a id="downloadLink" href="#" class="inline-block mt-2 bg-green-600 text-white px-6 py-2 rounded-full font-bold hover:bg-green-700 transition">Descargar PDF Firmado</a>
            </div>
        </div>

        <div id="view-validar" class="p-8 hidden bg-slate-50">
            <div class="text-center max-w-lg mx-auto">
                <div class="bg-white p-8 rounded-xl shadow border border-slate-200">
                    <div class="mb-4">
                        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                            <i class="fas fa-search"></i>
                        </div>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800 mb-2">Auditoría de Documentos</h2>
                    <p class="text-slate-500 text-sm mb-6">Sube un PDF para verificar si contiene metadatos esteganográficos válidos.</p>

                    <input type="file" id="pdfValidate" accept="application/pdf" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-6">

                    <button onclick="validarPDF()" class="w-full bg-slate-800 text-white py-3 rounded-lg font-bold hover:bg-slate-900 transition flex justify-center items-center">
                        <span id="btnValText">Verificar Integridad</span>
                        <div id="loadingVal" class="loader ml-2 hidden border-t-white"></div>
                    </button>
                </div>

                <div id="validationResult" class="mt-6 text-left hidden"></div>
            </div>
        </div>

    </div>

    <div id="editorModal" class="fixed inset-0 bg-black bg-opacity-75 hidden z-50 flex items-center justify-center">
        <div class="bg-white w-full h-full md:w-[90%] md:h-[90%] rounded-lg shadow-2xl relative overflow-hidden flex flex-col">
            <div class="bg-slate-800 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold"><i class="fas fa-arrows-alt text-blue-400 mr-2"></i>Ubica tu firma</h3>
                <button onclick="cerrarEditor()" class="text-gray-300 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>

            <iframe id="editorFrame" src="/editor" class="w-full h-full border-0"></iframe>

            <div id="finalLoader" class="absolute inset-0 bg-white bg-opacity-90 hidden flex flex-col items-center justify-center z-50">
                <div class="loader mb-4 border-t-blue-600 w-12 h-12"></div>
                <p class="text-blue-900 font-bold">Firmando Documento...</p>
            </div>
        </div>
    </div>

    <script>
        // --- LOGICA UI TABS ---
        function switchTab(tab) {
            document.getElementById('view-firmar').classList.add('hidden');
            document.getElementById('view-validar').classList.add('hidden');

            document.getElementById('tab-firmar').className = "flex-1 p-4 font-semibold text-slate-500 hover:bg-slate-50 transition-all";
            document.getElementById('tab-validar').className = "flex-1 p-4 font-semibold text-slate-500 hover:bg-slate-50 transition-all";

            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "flex-1 p-4 font-semibold text-blue-600 border-b-2 border-blue-600 bg-blue-50 transition-all";

            // CORRECCIÓN CRÍTICA: Redimensionar el canvas al volver a la pestaña firmar
            if (tab === 'firmar') {
                setTimeout(resizeCanvas, 50);
            }
        }

        // --- LÓGICA DEL CANVAS (DIBUJO) MEJORADA ---
        const canvas = document.getElementById('signature-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            // Guardar el contenido actual si quisieras (opcional), aquí lo reseteamos para ajustar al contenedor
            const rect = canvas.parentElement.getBoundingClientRect();

            // Asignar el tamaño real del elemento HTML al bitmap del canvas
            canvas.width = rect.width;
            canvas.height = rect.height; // Usar la altura del contenedor padre

            // Re-configurar el estilo del pincel (se borra al cambiar el tamaño)
            ctx.lineWidth = 2;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            ctx.strokeStyle = "#000000"; // Color negro explícito
        }

        // Obtener coordenadas exactas (mouse o táctil)
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // Eventos de dibujo
        function startDrawing(e) {
            isDrawing = true;
            ctx.beginPath();
            const pos = getPos(e);
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault(); // Evitar scroll en móviles
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // Listeners Mouse
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing); // Importante si te sales del cuadro

        // Listeners Touch (Móviles)
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        // Inicialización
        window.addEventListener("resize", resizeCanvas);
        // Esperar un momento a que el DOM cargue estilos para ajustar tamaño
        setTimeout(resizeCanvas, 100);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Restaurar estilos por si acaso
            ctx.lineWidth = 2;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            ctx.strokeStyle = "#000000";
        }

        // --- VALIDAR PDF (Tu código existente de validación) ---
        async function validarPDF() {
            const fileInput = document.getElementById('pdfValidate');
            const resultDiv = document.getElementById('validationResult');
            const btnText = document.getElementById('btnValText');
            const loader = document.getElementById('loadingVal');

            if (!fileInput.files[0]) return alert("Por favor selecciona un archivo PDF.");

            btnText.innerText = "Analizando...";
            loader.classList.remove('hidden');
            resultDiv.classList.add('hidden');
            resultDiv.innerHTML = "";

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const res = await fetch('/validar_pdf', { method: 'POST', body: formData });
                const data = await res.json();
                resultDiv.classList.remove('hidden');

                if (data.status === 'success') {
                    let htmlContent = `
                        <div class="flex items-center justify-center mb-6">
                            <span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full border border-green-200 shadow-sm">
                                <i class="fas fa-check-circle mr-1"></i> INTEGRIDAD VERIFICADA: ${data.cantidad} FIRMA(S)
                            </span>
                        </div>`;

                    data.datos.forEach((firma, index) => {
                        const device = firma.dispositivo || {};
                        const fecha = new Date(firma.fecha).toLocaleString('es-PE');

                        htmlContent += `
                        <div class="bg-white border border-slate-200 rounded-2xl shadow-lg mb-6 overflow-hidden transform transition-all hover:scale-[1.01]">
                            <div class="bg-slate-800 px-5 py-3 flex justify-between items-center border-b border-slate-700">
                                <div class="flex items-center space-x-2">
                                    <i class="fas fa-certificate text-yellow-400"></i>
                                    <span class="text-white font-bold text-xs tracking-widest uppercase">Certificado Digital #${index + 1}</span>
                                </div>
                                <span class="bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded font-bold">VÁLIDO</span>
                            </div>
                            <div class="p-6">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6 pb-6 border-b border-slate-100">
                                    <div class="flex flex-col">
                                        <label class="text-[10px] uppercase font-bold text-slate-400 mb-1">Firmante Autorizado</label>
                                        <div class="flex items-center">
                                            <div class="w-8 h-8 rounded bg-blue-50 flex items-center justify-center text-blue-600 mr-3"><i class="fas fa-user-shield"></i></div>
                                            <span class="text-slate-800 font-semibold text-sm break-all">${firma.email}</span>
                                        </div>
                                    </div>
                                    <div class="flex flex-col">
                                        <label class="text-[10px] uppercase font-bold text-slate-400 mb-1">Estampado de Tiempo</label>
                                        <div class="flex items-center">
                                            <div class="w-8 h-8 rounded bg-blue-50 flex items-center justify-center text-blue-600 mr-3"><i class="fas fa-clock"></i></div>
                                            <span class="text-slate-800 font-semibold text-sm">${fecha}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-6">
                                    <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 block">Token Único de Integridad (UUID)</label>
                                    <div class="bg-slate-50 p-3 rounded border border-slate-200 flex items-center">
                                        <i class="fas fa-key text-slate-400 mr-3"></i>
                                        <code class="text-xs text-blue-700 font-mono break-all">${firma.token}</code>
                                    </div>
                                </div>
                                <div>
                                    <label class="text-[10px] uppercase font-bold text-slate-400 mb-2 block flex items-center"><i class="fas fa-fingerprint mr-1"></i> Huella Digital del Dispositivo</label>
                                    <div class="bg-slate-50 rounded-lg border border-slate-100 p-3">
                                        <div class="grid grid-cols-2 gap-4 mb-3">
                                            <div><span class="text-[10px] text-slate-500 block">Resolución</span><span class="text-xs font-bold text-slate-700"><i class="fas fa-desktop text-slate-300 mr-1"></i>${device.screen || 'Desc.'}</span></div>
                                            <div><span class="text-[10px] text-slate-500 block">Núcleos CPU</span><span class="text-xs font-bold text-slate-700"><i class="fas fa-microchip text-slate-300 mr-1"></i>${device.cores || '1'} Cores</span></div>
                                        </div>
                                        <div class="border-t border-slate-200 pt-2">
                                            <span class="text-[10px] text-slate-500 block mb-1">User Agent (Navegador)</span>
                                            <div class="text-[10px] text-slate-600 font-mono bg-white p-2 rounded border border-slate-100 overflow-x-auto whitespace-nowrap">${device.ua || 'No disponible'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    });
                    resultDiv.innerHTML = htmlContent;
                } else {
                    resultDiv.innerHTML = `<div class="bg-white p-8 rounded-xl shadow-lg border-2 border-red-50 text-center"><div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fas fa-times-circle"></i></div><h3 class="text-red-700 font-bold text-lg">Firma No Detectada</h3><p class="text-slate-500 text-sm mt-2">El documento no contiene metadatos válidos o ha sido modificado.</p></div>`;
                }
            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = `<div class="bg-red-100 text-red-700 p-4 rounded text-center">Error de conexión.</div>`;
            } finally {
                btnText.innerText = "Verificar Integridad";
                loader.classList.add('hidden');
            }
        }

        // --- GESTIÓN DEL MODAL Y ENVÍO ---
        let finalPdfFile = null;
        let editorDataQueue = null;

        async function abrirEditor() {
            const email = document.getElementById('email').value;
            const pdfInput = document.getElementById('pdfInput');
            if(!email || !pdfInput.files[0]) return alert("Completa email y sube PDF");

            const blank = document.createElement('canvas');
            blank.width = canvas.width; blank.height = canvas.height;
            // Verificación simple de canvas vacío
            if(canvas.toDataURL().length < 2000) return alert("Por favor dibuja tu firma"); // Umbral básico

            finalPdfFile = pdfInput.files[0];
            const signatureDataUrl = canvas.toDataURL();

            const reader = new FileReader();
            reader.onload = function(e) {
                editorDataQueue = { type: 'INIT_EDITOR', pdfBlob: e.target.result, signatureImg: signatureDataUrl };
                document.getElementById('editorModal').classList.remove('hidden');
                document.getElementById('editorFrame').src = '/editor';
            };
            reader.readAsArrayBuffer(finalPdfFile);
        }

        function cerrarEditor() {
            document.getElementById('editorModal').classList.add('hidden');
            editorDataQueue = null;
        }

        window.addEventListener('message', (event) => {
            if (event.data.type === 'EDITOR_LOADED') {
                if (editorDataQueue) {
                    document.getElementById('editorFrame').contentWindow.postMessage(editorDataQueue, '*');
                    editorDataQueue = null;
                }
            }
            if (event.data.type === 'POSITION_CONFIRMED') {
                enviarFirmaFinal(event.data);
            }
        });

        async function enviarFirmaFinal(coords) {
            const loader = document.getElementById('finalLoader');
            loader.classList.remove('hidden');

            const email = document.getElementById('email').value;

            const metadata = {
                ua: navigator.userAgent,
                screen: `${window.screen.width}x${window.screen.height}`,
                cores: navigator.hardwareConcurrency || 1
            };

            const formData = new FormData();
            formData.append('email', email);
            formData.append('pdf_file', finalPdfFile);
            formData.append('firma_base64', canvas.toDataURL());
            formData.append('device_data', JSON.stringify(metadata));
            formData.append('x', coords.x);
            formData.append('y', coords.y);
            formData.append('w', coords.w);
            formData.append('h', coords.h);
            formData.append('page_num', coords.page_num);

            try {
                const res = await fetch('/procesar_firma', { method: 'POST', body: formData });
                const data = await res.json();
                if(data.status === 'success') {
                    cerrarEditor();
                    document.getElementById('resultSign').classList.remove('hidden');
                    document.getElementById('downloadLink').href = data.download_url;
                } else {
                    alert("Error: " + data.msg);
                }
            } catch(e) { alert("Error de servidor"); }
            finally { loader.classList.add('hidden'); }
        }
    </script>
</body>
</html>
